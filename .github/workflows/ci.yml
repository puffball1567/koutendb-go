name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        if: runner.os == 'Linux' && matrix.go == 'stable'
      - run: go test -race -count=1 ./...
        if: runner.os != 'Windows'
      - run: go test -run='^$' -fuzz=FuzzParseID -fuzztime=5s -parallel=2 .
        if: runner.os == 'Linux'
      - run: go test -run='^$' -fuzz=FuzzHeader -fuzztime=5s -parallel=2 .
        if: runner.os == 'Linux'

  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Checkout shared protocol tests and core
        uses: actions/checkout@v4
        with:
          repository: puffball1567/koutendb
          ref: d7023527afae88110f54ed58795fe34bc7701a5f
          path: koutendb-core
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libssl-dev
      - uses: jiro4989/setup-nim-action@v2
        if: runner.os == 'Linux'
        with:
          nim-version: '2.2.10'
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install nim libsodium openssl@3
          sodium="$(brew --prefix libsodium)"
          ssl="$(brew --prefix openssl@3)"
          echo "CPATH=$sodium/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$sodium/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$PWD/koutendb-core/lib:$sodium/lib:$ssl/lib" >> "$GITHUB_ENV"
          echo "$ssl/bin" >> "$GITHUB_PATH"
      - name: Build core and native adapter
        shell: bash
        run: |
          cd koutendb-core
          nimble install -y
          if [[ "$RUNNER_OS" == macOS ]]; then export KOUTENDB_CAPI_OUT=lib/libkoutendb.dylib; fi
          bash scripts/build_capi.sh
          cd ..
          CGO_ENABLED=0 go build -o bin/conformance ./cmd/conformance
      - name: Protocol, authentication and TLS matrix
        shell: bash
        run: bash koutendb-core/scripts/native_driver_conformance.sh "$PWD/bin/conformance"
      - name: Embedded contract and example
        shell: bash
        run: |
          export CGO_LDFLAGS="-L$PWD/koutendb-core/lib"
          export LD_LIBRARY_PATH="$PWD/koutendb-core/lib:${LD_LIBRARY_PATH:-}"
          go test -race -tags=kouten_embedded -count=1 ./...
          go run -tags=kouten_embedded ./examples/embedded
